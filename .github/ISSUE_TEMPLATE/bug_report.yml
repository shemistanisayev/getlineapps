name: Bug report
description: Something in a Line app does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are public. Please do not include passwords, API keys, customer data or private URLs.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Hitline, Serpline, Rivaline, Foldline, Markline, getlineapps.com]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version and Chrome version
      placeholder: Hitline 1.0.0, Chrome 131
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: The steps that lead to the problem, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
