<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivaline side panel: read this tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.rv{font-family:Inter,Arial,sans-serif;color:#101828;-webkit-font-smoothing:antialiased}
.rv a{text-decoration:none}
.disp{font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif}
.card{background:#FFFFFF;border:1px solid #DCD9E6;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px -6px rgba(52,30,120,.12)}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;font-weight:600;color:#101828;background:#EAE8F0;border-radius:6px;padding:3px 7px;box-shadow:inset 0 -1px 0 #C9C5D6}
.step{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:#344054}
.step b{width:24px;height:24px;border-radius:8px;background:#CFFAFE;color:#155E75;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@keyframes ac-ping{0%{box-shadow:0 0 0 0 rgba(14,116,144,.5)}80%,100%{box-shadow:0 0 0 12px rgba(14,116,144,0)}}
.ping{animation:ac-ping 1.6s infinite}
</style>
</helmet>
<div class="rv" style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #EEF1F6; display: flex; flex-direction: column">
<div style="width: 100%; height: 84px; flex-shrink: 0"><dc-import name="BrowserBar" host="example.net" path="/" active-tab="2" panel-open="true" ping="true" hint-size="100%,84px"></dc-import></div>
<div style="height: 816px; display: flex; gap: 8px; padding: 0 8px 8px 0; box-sizing: border-box">
<div style="flex-grow: 1; min-width: 0; height: 808px; overflow: hidden; border-radius: 0 0 12px 0"><dc-import name="SitePage" variant="glow" hint-size="100%,808px"></dc-import></div>
<aside aria-label="Rivaline side panel" style="width: 400px; flex-shrink: 0; height: 800px; margin-top: 8px; border-radius: 12px; overflow: hidden; background: #EFEDF5; box-shadow: 0 0 0 1px #DCD9E6; display: flex; flex-direction: column">
<div style="height: 40px; flex-shrink: 0; border-bottom: 1px solid #EAE8F0"><dc-import name="PanelChrome" hint-size="100%,40px"></dc-import></div>
<div style="flex-shrink: 0"><dc-import name="PanelHeader" empty="true" hint-size="100%,96px"></dc-import></div>
<div style="flex-grow: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div class="card" style="padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<span class="ping" style="width: 52px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCD9E6; display: flex; align-items: center; justify-content: center"><dc-import name="Logo" brand="rivaline" theme="light" size="30" word="false" hint-size="30px,30px"></dc-import></span>
<span class="disp" style="font-size: 18px; font-weight: 800">Read this tab?</span>
<span style="font-size: 13px; line-height: 1.55; color: #475467; max-width: 300px">You switched to example.net. Rivaline reads a page only after you ask it to.</span>
</div>
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div class="step"><b><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"></path></svg></b><span>Click the <strong style="color: #101828">Rivaline icon</strong> in the toolbar</span></div>
<div class="step"><b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"></path></svg></b><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">Or press <span class="kbd">Alt</span><span class="kbd">Shift</span><span class="kbd">R</span></span></div>
</div>
<p style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.55; color: #667085">This is how Chrome's activeTab permission works. Rivaline never gets access to all the sites you visit.</p>
</div>
</aside>
</div>
</div>
</x-dc>

</body>
</html>
