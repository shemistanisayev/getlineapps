<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Annotated screenshot of the Bramble order page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
.sh .pin{position:absolute;width:36px;height:36px;border-radius:50%;background:#FACC15;color:#101828;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2.5px #101828,0 0 0 3px #FFFFFF,0 4px 10px rgba(16,24,40,.35)}
.sh .bx{position:absolute;box-sizing:border-box;border:4px solid #101828;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.sh .bl{position:absolute;border-radius:5px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:rgba(226,232,240,.35)}
.sh .hd{position:absolute;width:12px;height:12px;border-radius:3px;background:#FFFFFF;box-shadow:0 0 0 2px #FACC15}
.sh .tag{position:absolute;height:24px;padding:0 8px;border-radius:6px;background:#101828;color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
</style>
</helmet>
<div class="sh" style="width: 1440px; height: 2400px; position: relative; overflow: hidden">
<dc-import name="SitePage" hint-size="1440px,2400px"></dc-import>
<div style="position: absolute; inset: 0">
<div class="bl" style="left: 156px; top: 450px; width: 236px; height: 28px"></div>
<div class="bl" style="left: 156px; top: 536px; width: 118px; height: 28px"></div>
<sc-if value="{{footerBlur}}" hint-placeholder-val="{{true}}"><div class="bl" style="left: 936px; top: 2192px; width: 182px; height: 28px; background: rgba(43,29,18,.35)"></div><div class="bl" style="left: 936px; top: 2220px; width: 104px; height: 28px; background: rgba(43,29,18,.35)"></div></sc-if>
<sc-if value="{{nameBlur}}" hint-placeholder-val="{{false}}"><div class="bl" style="left: 156px; top: 364px; width: 108px; height: 28px"></div></sc-if>
<sc-if value="{{blurMode}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 152px; top: 446px; width: 244px; height: 36px; box-sizing: border-box; border: 2px dashed #FACC15; border-radius: 7px"></div><span class="tag" style="left: 404px; top: 452px; background: #FACC15">Auto</span>
<div style="position: absolute; left: 152px; top: 532px; width: 126px; height: 36px; box-sizing: border-box; border: 2px dashed #FACC15; border-radius: 7px"></div><span class="tag" style="left: 286px; top: 538px; background: #FACC15">Auto</span>
<div style="position: absolute; left: 156px; top: 364px; width: 108px; height: 28px; box-sizing: border-box; border: 2px solid #FACC15; border-radius: 5px; background: rgba(250,204,21,.10)"></div>
<span class="tag" style="left: 156px; top: 330px">108 x 28</span>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#101828" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 251px; top: 379px"><path d="M12 3v18M3 12h18"></path></svg>
</sc-if>

<div class="bx" style="left: 140px; top: 604px; width: 326px; height: 64px; border-radius: 12px"></div>
<sc-if value="{{sel1}}" hint-placeholder-val="{{true}}"><span class="hd" style="left: 134px; top: 598px"></span><span class="hd" style="left: 460px; top: 598px"></span><span class="hd" style="left: 134px; top: 662px"></span><span class="hd" style="left: 460px; top: 662px"></span></sc-if>
<span class="pin" style="left: 448px; top: 586px">1</span>

<svg width="1440" height="2400" viewBox="0 0 1440 2400" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M556 792 C 480 770, 420 742, 368 714" fill="none" stroke="#101828" stroke-width="5" stroke-linecap="round"></path><path d="M356 708 L 384 702 L 370 728 Z" fill="#101828" stroke="#101828" stroke-width="4" stroke-linejoin="round"></path></svg>
<span class="pin" style="left: 552px; top: 782px">2</span>
<span style="position: absolute; left: 600px; top: 786px; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 800; color: #101828; white-space: nowrap; text-shadow: 0 0 3px #FFFFFF, 0 0 3px #FFFFFF, 0 0 6px #FFFFFF">Easy to miss</span>

<div style="position: absolute; left: 878px; top: 594px; width: 424px; height: 62px; border-radius: 6px; background: rgba(250, 204, 21, 0.45)"></div>
<span class="pin" style="left: 1284px; top: 576px">3</span>

<div class="bx" style="left: 878px; top: 524px; width: 118px; height: 32px; border-radius: 8px"></div>
<span class="pin" style="left: 978px; top: 506px">4</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["editor","blur","final"],"default":"editor"},"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
renderVals() {
var v = this.props.variant || 'editor';
return {
footerBlur: v === 'editor',
nameBlur: v === 'final',
blurMode: v === 'blur',
sel1: v === 'editor'
};
}
}
</script>
</body>
</html>
