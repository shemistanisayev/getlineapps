<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markline editor: blur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.ml{font-family:Inter,Arial,sans-serif;color:#101828;-webkit-font-smoothing:antialiased}
.ml button{font-family:Inter,Arial,sans-serif;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.disp{font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#667085}
.card{background:#FFFFFF;border-radius:12px;box-shadow:0 0 0 1px #DCD9E6}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:#EEEDF3}
.seg button{flex:1;height:30px;border:none;border-radius:8px;background:transparent;font-size:12.5px;font-weight:600;color:#475467}
.seg button[aria-pressed=true]{background:#FFFFFF;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.12),0 0 0 1px #DCD9E6}
.br{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #EAE8F0}
.sw{width:34px;height:20px;border-radius:999px;position:relative;border:none;padding:0;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#FFFFFF}
.sw.on{background:#101828}.sw.on:after{right:3px;background:#FACC15}
.sw.off{background:#C9C5D6}.sw.off:after{left:3px}
.del{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:#667085;display:flex;align-items:center;justify-content:center;padding:0}
.del:hover{background:#EEEDF3;color:#101828}
</style>
</helmet>
<div class="ml" style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #EFEDF5; display: flex; flex-direction: column">
<div style="width: 100%; height: 84px; flex-shrink: 0"><dc-import name="BrowserBar" host="chrome-extension://hmlkcfjbaopgnied" path="/editor.html" tab="Markline: example.com/order" favicon="markline" tab2="Your order | Bramble Bakery" favicon2="bramble" hint-size="100%,84px"></dc-import></div>
<div style="flex-shrink: 0"><dc-import name="EditorBar" tool="blur" hint-size="100%,60px"></dc-import></div>
<div style="height: 756px; display: flex">
<main aria-label="Capture" style="flex-grow: 1; min-width: 0; position: relative; overflow: hidden; padding: 28px 0 0 46px">
<div style="width: 1008px; height: 1680px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(16,24,40,.08), 0 24px 48px -24px rgba(16,24,40,.35)"><div style="width: 1440px; height: 2400px; transform: scale(0.7); transform-origin: 0 0"><dc-import name="Shot" variant="blur" hint-size="1440px,2400px"></dc-import></div></div>
<div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: #101828; color: #FFFFFF; font-size: 12.5px; font-weight: 500; white-space: nowrap; box-shadow: 0 12px 24px -10px rgba(16,24,40,.6)">Drag over anything you want to hide</div>
</main>
<aside aria-label="Blur" style="width: 340px; flex-shrink: 0; background: #F7F6FB; border-left: 1px solid #DCD9E6; display: flex; flex-direction: column; gap: 12px; padding: 14px 12px 12px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px"><span class="disp" style="font-size: 16px; font-weight: 800">Blur</span><span style="font-size: 12.5px; line-height: 1.45; color: #475467">Hide names, emails and anything private before you share.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="eyebrow" style="padding: 0 4px">Style</span><div class="seg" role="group" aria-label="Blur style"><button type="button" aria-pressed="true">Blur</button><button type="button" aria-pressed="false">Pixelate</button><button type="button" aria-pressed="false">Solid</button></div></div>
<div class="card" style="overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 8px"><span class="eyebrow">Found on the page</span><span style="font-size: 12px; font-weight: 600; color: #475467">2 of 4 on</span></div>
<sc-for list="{{found}}" as="f" hint-placeholder-count="4">
<div class="br"><dc-import name="Glyph" kind="{{f.k}}" tone="{{f.tone}}" size="28" hint-size="28px,28px"></dc-import><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">{{f.n}}</span><span style="font-size: 12px; color: #667085">{{f.w}}</span></span><button type="button" class="sw {{f.cls}}" role="switch" aria-checked="{{f.on}}" aria-label="Blur {{f.n}} in {{f.w}}"></button></div>
</sc-for>
</div>
<div class="card" style="overflow: hidden">
<div style="padding: 10px 12px 8px"><span class="eyebrow">Drawn by you</span></div>
<div class="br" style="background: #FEFCE8"><dc-import name="Glyph" kind="blur" tone="solid" size="28" hint-size="28px,28px"></dc-import><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 600">Area 1</span><span class="mono" style="font-size: 11.5px; color: #475467">108 x 28 px</span></span><button type="button" class="del" aria-label="Remove area 1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button></div>
</div>
<span style="flex-grow: 1"></span>
<div style="display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #EEEDF3; color: #344054; font-size: 12px; line-height: 1.45"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="9.5" rx="2.2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span>Blur is painted into the exported image. The text under it is not kept in the file.</span></div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var f = function (k, n, w, on) { return { k: k, n: n, w: w, on: on ? 'true' : 'false', cls: on ? 'on' : 'off', tone: on ? 'brand' : 'neutral' }; };
return {
found: [
f('email', 'Email', 'Your details form', true),
f('phone', 'Phone number', 'Your details form', true),
f('email', 'Email', 'Footer', false),
f('phone', 'Phone number', 'Footer', false)
]
};
}
}
</script>
</body>
</html>
