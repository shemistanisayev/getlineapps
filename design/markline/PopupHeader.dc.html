<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markline popup header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ph button{font-family:Inter,Arial,sans-serif;cursor:pointer}
.ph-ib{width:32px;height:32px;border-radius:9px;border:1px solid #C9C5D6;background:#FFFFFF;color:#344054;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
.ph-ib:hover{background:#F9FAFB}
</style>
</helmet>
<div class="ph" style="width: 100%; height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #DCD9E6; font-family: Inter, Arial, sans-serif; color: #101828; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px">
<dc-import name="Logo" brand="markline" theme="light" size="24" word="true" hint-size="110px,24px"></dc-import>
<span style="flex-grow: 1"></span>
<button type="button" class="ph-ib" aria-label="Open an image in the editor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 15.5l-5-5-9 8.5"></path></svg></button>
<button type="button" class="ph-ib" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.830-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":56}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
