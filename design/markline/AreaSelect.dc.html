<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markline on the page: select an area</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.ml{font-family:Inter,Arial,sans-serif;color:#101828;-webkit-font-smoothing:antialiased}
.ml button{font-family:Inter,Arial,sans-serif;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.hd{position:absolute;width:10px;height:10px;border-radius:3px;background:#FFFFFF;box-shadow:0 0 0 2px #FACC15}
.kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;color:#FFFFFF;background:rgba(255,255,255,.16);border-radius:5px;padding:1px 6px}
.btn{height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;transition:background .15s}
.btn-p{background:#FACC15;color:#101828}
.btn-p:hover{background:#EAB308}
.btn-s{background:#FFFFFF;color:#344054;box-shadow:inset 0 0 0 1px #C9C5D6}
</style>
</helmet>
<div class="ml" style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column">
<div style="width: 100%; height: 84px; flex-shrink: 0"><dc-import name="BrowserBar" ext-active="true" hint-size="100%,84px"></dc-import></div>
<div style="width: 100%; height: 816px; overflow: hidden; position: relative">
<dc-import name="SitePage" height="816" hint-size="1440px,816px"></dc-import>
<div aria-label="Markline area selection" style="position: absolute; inset: 0; overflow: hidden; cursor: crosshair">
<div style="position: absolute; left: 848px; top: 248px; width: 484px; height: 444px; box-shadow: 0 0 0 2px #FACC15, 0 0 0 4000px rgba(16, 24, 40, 0.52); border-radius: 2px">
<span class="hd" style="left: -6px; top: -6px"></span><span class="hd" style="right: -6px; top: -6px"></span><span class="hd" style="left: -6px; bottom: -6px"></span><span class="hd" style="right: -6px; bottom: -6px"></span>
<span class="hd" style="left: 236px; top: -6px"></span><span class="hd" style="left: 236px; bottom: -6px"></span><span class="hd" style="left: -6px; top: 216px"></span><span class="hd" style="right: -6px; top: 216px"></span>
<span class="mono" style="position: absolute; left: 0; top: -34px; height: 24px; padding: 0 9px; border-radius: 7px; background: #101828; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center">484 x 444</span>
<div style="position: absolute; right: 0; top: 458px; display: flex; gap: 8px; padding: 6px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 16px 32px -12px rgba(16,24,40,.45), 0 0 0 1px rgba(16,24,40,.08)">
<button type="button" class="btn btn-s">Cancel</button>
<button type="button" class="btn btn-p"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg>Capture area</button>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; right: -16px; bottom: -16px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6))"><path d="M12 3v18M3 12h18"></path></svg>
</div>
<div role="status" style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 10px; border-radius: 999px; background: #101828; color: #FFFFFF; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 12px 24px -10px rgba(16,24,40,.6)">
<dc-import name="Logo" brand="markline" theme="dark" size="22" word="false" hint-size="22px,22px"></dc-import>
<span>Drag to select an area.</span><span style="display: flex; align-items: center; gap: 5px; color: #D0D5DD"><span class="kbd">Enter</span>to capture</span><span style="display: flex; align-items: center; gap: 5px; color: #D0D5DD"><span class="kbd">Esc</span>to cancel</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
