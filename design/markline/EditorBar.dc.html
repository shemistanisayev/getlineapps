<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markline editor toolbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.eb button,.eb select{font-family:Inter,Arial,sans-serif}
.eb button{cursor:pointer}
.eb-tool{width:36px;height:36px;border:none;border-radius:9px;background:transparent;color:#344054;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s}
.eb-tool:hover{background:#FFFFFF}
.eb-tool:disabled{color:#98A2B3;background:transparent;cursor:default}
.eb-ib{width:34px;height:34px;border-radius:9px;border:1px solid #C9C5D6;background:#FFFFFF;color:#344054;display:inline-flex;align-items:center;justify-content:center;padding:0}
.eb-ib:disabled{color:#98A2B3;background:#F7F6FB;cursor:default}
.eb-sw{width:24px;height:24px;border-radius:50%;border:none;padding:0}
.eb-btn{height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.eb-s{border:1px solid #C9C5D6;background:#FFFFFF;color:#344054}
.eb-s:hover{background:#F9FAFB}
.eb-p{border:none;background:#FACC15;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.35)}
.eb-p:hover{background:#EAB308}
.eb-p:disabled,.eb-s:disabled{background:#EAE8F0;color:#667085;box-shadow:none;border-color:#EAE8F0;cursor:default}
</style>
</helmet>
<div class="eb" style="width: 100%; height: 60px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #DCD9E6; font-family: Inter, Arial, sans-serif; color: #101828; display: flex; align-items: center; gap: 14px; padding: 0 16px">
<dc-import name="Logo" brand="markline" theme="light" size="24" word="true" hint-size="110px,24px"></dc-import>
<span style="width: 1px; height: 28px; background: #EAE8F0"></span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; width: 230px"><span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span><span style="font-size: 12px; color: #667085">{{sub}}</span></span>
<span style="flex-grow: 1"></span>
<div role="toolbar" aria-label="Tools" style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #EEEDF3">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="7">
<button type="button" class="eb-tool" aria-label="{{t.label}}" title="{{t.label}}" aria-pressed="{{t.on}}" disabled="{{empty}}" style="background: {{t.bg}}; color: {{t.ink}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></button>
</sc-for>
</div>
<div role="group" aria-label="Color" style="display: flex; gap: 6px; align-items: center; padding: 0 4px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="5">
<button type="button" class="eb-sw" aria-label="{{c.label}}" aria-pressed="{{c.on}}" disabled="{{empty}}" style="background: {{c.hex}}; box-shadow: {{c.ring}}"></button>
</sc-for>
</div>
<span style="display: flex; gap: 6px"><button type="button" class="eb-ib" aria-label="Undo" disabled="{{empty}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button><button type="button" class="eb-ib" aria-label="Redo" disabled="disabled"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button></span>
<span style="flex-grow: 1"></span>
<label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #475467"><span>Zoom</span><select aria-label="Zoom" disabled="{{empty}}" style="height: 34px; border: 1px solid #8E8A9D; border-radius: 9px; padding: 0 6px; font-size: 13px; color: #101828; background: #FFFFFF"><option>{{zoom}}</option><option>Fit width</option><option>100%</option></select></label>
<button type="button" class="eb-btn eb-s" disabled="{{empty}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"></path></svg>Copy image</button>
<button type="button" class="eb-btn eb-p" disabled="{{empty}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>Export</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tool":{"editor":"enum","options":["select","arrow","box","number","text","highlight","blur"],"default":"number"},"color":{"editor":"enum","options":["ink","yellow","blue","red","green"],"default":"ink"},"empty":{"editor":"boolean","default":false},"title":{"editor":"text","default":"example.com/order"},"sub":{"editor":"text","default":"Full page, 1440 x 2400"},"zoom":{"editor":"text","default":"70%"},"$preview":{"width":1440,"height":60}}'>
class Component extends DCLogic {
renderVals() {
var p = this.props;
var e = p.empty;
var empty = e === true || e === 'true';
var tool = p.tool || 'number';
var color = p.color || 'ink';
var T = [
['select', 'Select (V)', 'M5.5 3.5l12.5 6.3-5.4 1.8-1.8 5.4z'],
['arrow', 'Arrow (A)', 'M5 19L19 5M10 5h9v9'],
['box', 'Box (R)', 'M6 5h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z'],
['number', 'Numbered note (N)', 'M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0-17 0zM10.5 9.5l2-1.5V16'],
['text', 'Text (T)', 'M5 6.5V4.5h14v2M12 4.5v15M9 19.5h6'],
['highlight', 'Highlight (H)', 'M14.5 4l5.5 5.5-8 8H6.5V12zM4 21h16'],
['blur', 'Blur (B)', 'M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z']
];
var C = [['ink', 'Black', '#101828'], ['yellow', 'Yellow', '#FACC15'], ['blue', 'Blue', '#2563EB'], ['red', 'Red', '#D92D20'], ['green', 'Green', '#12B76A']];
return {
empty: empty,
title: p.title ?? 'example.com/order',
sub: p.sub ?? 'Full page, 1440 x 2400',
zoom: p.zoom ?? '70%',
tools: T.map(function (t) { var on = !empty && t[0] === tool; return { label: t[1], d: t[2], on: on ? 'true' : 'false', bg: on ? '#FACC15' : 'transparent', ink: on ? '#101828' : (empty ? '#98A2B3' : '#344054') }; }),
colors: C.map(function (c) { var on = !empty && c[0] === color; return { label: c[1], hex: empty ? '#D0D5DD' : c[2], on: on ? 'true' : 'false', ring: on ? '0 0 0 2px #FFFFFF, 0 0 0 4px ' + c[2] : 'inset 0 0 0 1px rgba(16,24,40,.12)' }; })
};
}
}
</script>
</body>
</html>
