<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireless Headphones Pro X | Lumo</title>
    <meta
      name="description"
      content="Active noise cancelling, 30-hour battery and fast charging. Bluetooth 5.3 connects to two devices at once. Free next-day delivery and free returns within 14 days on all Lumo Audio headphones."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/products/wireless-headphones-pro-x" />
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="Lumo" />
    <meta property="og:title" content="Wireless Headphones Pro X | Lumo" />
    <meta property="og:url" content="/products/wireless-headphones-pro-x" />
    <meta property="og:image" content="/img/pro-x-front.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/lumo.css" />
    <link rel="stylesheet" href="/serpline/seo.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "/" },
          { "@type": "ListItem", "position": 2, "name": "Electronics", "item": "/electronics" },
          { "@type": "ListItem", "position": 3, "name": "Headphones", "item": "/headphones" },
          { "@type": "ListItem", "position": 4, "name": "Wireless Headphones Pro X" }
        ]
      }
    </script>
  </head>
  <body>
    <!--
      Lumo, Serpline scenario (docs/serpline-SPEC.md §10, design/serpline/SitePage.dc.html).
      The server HTML has the header, breadcrumb, gallery and price only. /serpline/product.js adds
      the H1, the description, the details, reviews and related sections, the footer links and the
      Product JSON-LD, so a crawler that does not run JavaScript sees 38 words.
    -->
    <div class="promo">Free shipping on orders over $50</div>
    <header class="head">
      <a class="brand" href="/" aria-label="Lumo home"
        ><span class="brand-tile" aria-hidden="true"></span>lumo</a
      >
      <nav aria-label="Categories" class="cats">
        <a href="/electronics" class="on">Electronics</a>
        <a href="/home-kitchen">Home &amp; kitchen</a>
        <a href="/beauty">Beauty</a>
        <a href="/kids">Kids</a>
        <a href="/sale" class="sale">Sale</a>
      </nav>
      <label class="search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input aria-label="Search products" placeholder="Products, brands or categories" />
      </label>
      <div class="icons">
        <a href="/account" aria-label="My account" class="icon"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg
        ></a>
        <a href="/cart" aria-label="Cart, 1 item" class="icon"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 7h14l-1.5 12h-11z"></path>
            <path d="M9 7a3 3 0 0 1 6 0"></path></svg
          ><span class="badge seo-badge" aria-hidden="true"></span
        ></a>
      </div>
    </header>
    <main id="main" class="main">
      <nav aria-label="Breadcrumb" class="crumb">
        <a href="/">Home</a> / <a href="/electronics">Electronics</a> /
        <a href="/headphones">Headphones</a> / <span>Wireless Headphones Pro X</span>
      </nav>
      <div class="product">
        <div class="gallery">
          <img
            class="hero-img seo-img"
            src="/img/pro-x-front.jpg"
            alt="Black wireless headphones"
            width="440"
            height="440"
          />
          <div class="seo-thumbs">
            <img src="/img/pro-x-front-small.jpg" alt="" width="84" height="84" />
            <img src="/img/pro-x-side.jpg" width="84" height="84" />
            <img src="/img/pro-x-folded.jpg" width="84" height="84" />
            <img src="/img/pro-x-case.jpg" width="84" height="84" />
          </div>
        </div>
        <div class="info">
          <span class="eyebrow">Lumo Audio</span>
          <div id="product-title"></div>
          <div class="price"><b>$89.90</b> <s>$119.90</s> <i>-25%</i></div>
          <div id="product-summary"></div>
          <p class="seo-color">Color: Black</p>
          <div class="seo-swatches">
            <button type="button" aria-label="Black" class="on"></button>
            <button type="button" aria-label="White"></button>
            <button type="button" aria-label="Blue"></button>
          </div>
          <button type="button" class="btn">Add to cart</button>
          <ul class="perks">
            <li>Free next-day delivery</li>
            <li><a href="/returns">Free returns</a> within 14 days</li>
          </ul>
        </div>
      </div>
      <div id="product-more"></div>
    </main>
    <footer class="foot seo-foot">
      <div id="footer-links"></div>
      <nav aria-label="Lumo elsewhere" class="seo-social">
        <a
          href="https://www.instagram.com/lumo.shop"
          aria-label="Instagram"
          rel="me"
          data-l="IG"
        ></a>
        <a href="https://www.facebook.com/lumo.shop" aria-label="Facebook" rel="me" data-l="FB"></a>
        <a href="https://www.youtube.com/@lumo.shop" aria-label="YouTube" rel="me" data-l="YT"></a>
        <a href="https://www.tiktok.com/@lumo.shop" aria-label="TikTok" rel="me" data-l="TT"></a>
        <a
          href="https://www.pinterest.com/lumo.shop"
          aria-label="Pinterest"
          rel="me"
          data-l="PI"
        ></a>
        <a href="https://x.com/lumo_shop" aria-label="X" rel="me" data-l="X"></a>
      </nav>
    </footer>
    <script src="/serpline/product.js" defer></script>
  </body>
</html>
