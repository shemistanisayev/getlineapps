<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mira Studio | Illustration</title>
    <!-- Mira Studio (design/rivaline/SitePage.dc.html, variant studio): no marketing tools at all (Empty). -->
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #1c1917;
        background: #ffffff;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        height: 72px;
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 0 48px;
        border-bottom: 1px solid #e7e5e4;
      }
      .site-logo {
        font-size: 20px;
        font-weight: 700;
      }
      .grow {
        flex-grow: 1;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 14px;
        color: #44403c;
      }
      main {
        padding: 72px 48px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-size: 50px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        max-width: 620px;
      }
      p {
        margin: 0;
        font-size: 17px;
        color: #57534e;
      }
      .work {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 12px;
      }
      .work span {
        height: 260px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="site-logo">Mira Studio</a>
      <span class="grow"></span>
      <nav><a href="/work">Work</a><a href="/about">About</a><a href="/contact">Contact</a></nav>
    </header>
    <main>
      <h1>Illustration for books, magazines and brands.</h1>
      <p>Based in Lisbon. Open for commissions.</p>
      <div class="work" aria-hidden="true">
        <span style="background: #fde68a"></span><span style="background: #bfdbfe"></span
        ><span style="background: #fecaca"></span>
      </div>
    </main>
  </body>
</html>
