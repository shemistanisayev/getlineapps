<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glowbar | Clean beauty</title>
    <meta property="og:site_name" content="Glowbar" />
    <!--
      Glowbar (design/rivaline/SitePage.dc.html, variant glow). Used for the tab switch test and as a
      second stack: Shopify, GA4 through gtag.js, Meta Pixel, Klaviyo and Cookiebot.
    -->
    <script
      src="https://consent.cookiebot.com/uc.js"
      data-cbid="00000000-0000-4000-8000-000000000000"
      async
    ></script>
    <script>
      window.Shopify = { shop: 'glowbar.myshopify.com', theme: { name: 'Sense', id: 2 } };
    </script>
    <script
      src="https://cdn.shopify.com/shopifycloud/storefront/assets/storefront-glow.js"
      async
    ></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GLOW2026"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', { ad_storage: 'denied', analytics_storage: 'denied' });
      gtag('js', new Date());
      gtag('config', 'G-GLOW2026');
    </script>
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '902718364501928');
      fbq('track', 'PageView');
    </script>
    <script async src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=GlowBX"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff7fb;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        height: 72px;
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 0 40px;
        background: #fff1f7;
        border-bottom: 1px solid #fbcfe8;
      }
      .site-logo {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #831843;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 14px;
        color: #831843;
      }
      main {
        padding: 80px 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      h1 {
        margin: 0;
        font-size: 56px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: #500724;
        max-width: 560px;
      }
      p {
        margin: 0;
        font-size: 17px;
        color: #9d174d;
      }
      .btn {
        align-self: flex-start;
        height: 48px;
        padding: 0 26px;
        border-radius: 12px;
        background: #db2777;
        color: #ffffff;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="site-logo">glowbar</a>
      <nav>
        <a href="/collections/makeup">Makeup</a><a href="/collections/skin">Skin</a
        ><a href="/collections/bestsellers">Bestsellers</a>
      </nav>
    </header>
    <main>
      <h1>Clean beauty, delivered monthly.</h1>
      <p>Build your box, skip any month.</p>
      <a class="btn" href="/pages/box">Build my box</a>
    </main>
  </body>
</html>
